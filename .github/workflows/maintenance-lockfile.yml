name: Maintenance lockfile repair

on:
  push:
    branches: [maintenance/resolve-open-prs-20260922]
    paths: [.github/workflows/maintenance-lockfile.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/maintenance-lockfile.yml]

permissions:
  contents: write

concurrency:
  group: maintenance-lockfile-20260922
  cancel-in-progress: false

jobs:
  lockfile:
    if: >-
      github.repository == 'satyrlord/mb' &&
      (github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == 'satyrlord/mb' &&
      github.event.pull_request.head.ref == 'maintenance/resolve-open-prs-20260922'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve requested versions without running package scripts
        env:
          npm_config_engine_strict: 'true'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync('package.json', 'utf8');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/memoryblox-package.json`, text);
          const pkg = JSON.parse(text);
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const targets = {
            '@playwright/test': '1.63.0',
            '@types/jsdom': '30.0.0',
            '@vitest/coverage-istanbul': '5.0.1',
            concurrently: '10.0.5',
            jsdom: '30.0.1',
            'markdownlint-cli2': '0.23.2',
            tsx: '4.23.13',
            vitest: '5.0.1',
          };
          for (const name of Object.keys(pkg.devDependencies)) {
            const version = targets[name] ?? lock.packages[`node_modules/${name}`]?.version;
            if (!version) throw new Error(`Missing locked version: ${name}`);
            pkg.devDependencies[name] = version;
          }
          fs.writeFileSync('package.json', JSON.stringify(pkg) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync(`${process.env.RUNNER_TEMP}/memoryblox-package.json`, 'utf8');
          const pkg = JSON.parse(text);
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.packages[''].devDependencies = pkg.devDependencies;
          lock.packages[''].engines = pkg.engines;
          const targets = {
            '@playwright/test': '1.63.0',
            '@types/jsdom': '30.0.0',
            '@vitest/coverage-istanbul': '5.0.1',
            concurrently: '10.0.5',
            jsdom: '30.0.1',
            'markdownlint-cli2': '0.23.2',
            tsx: '4.23.13',
            vitest: '5.0.1',
          };
          for (const [name, version] of Object.entries(targets)) {
            if (lock.packages[`node_modules/${name}`]?.version !== version) {
              throw new Error(`Unexpected resolved version: ${name}`);
            }
          }
          fs.writeFileSync('package.json', text);
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
          git diff --exit-code -- package.json
          git diff --stat
      - name: Commit only the regenerated lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git commit -m 'chore(deps): regenerate lockfile for consolidated updates'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/maintenance/resolve-open-prs-20260922
